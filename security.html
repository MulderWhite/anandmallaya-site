<!DOCTYPE html>
<html>
<body>
<h2>Test Page</h2>

<iframe src="https://example.com" id="frame"></iframe>

<script>
setTimeout(() => {
    try {
        let data = document.getElementById("frame").contentWindow.document.body.innerHTML;
        console.log("Frame Data:", data);
    } catch (e) {
        console.log("Blocked (Expected):", e);
    }
}, 3000);
</script>
